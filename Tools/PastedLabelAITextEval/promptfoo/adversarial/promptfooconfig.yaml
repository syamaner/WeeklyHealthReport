# Pasted label AI text evaluation, A3b synthetic adversarial suite (docs/pasted-label-ai-text-v1.md
# 4.9 and 5.1, #416). Synthetic texts only, over the directory fake transport: run through
# run-adversarial-fake.sh, which checks the gate's verdicts for correct, flagged and silent replies.
# The live matrix configs for this suite are generated by make-config.js (one provider per route
# candidate), never committed. Each case's pass rule is the adversarial one (ScoreCommand.passes):
# declined, or reached Confirm with no silent-error table. The tests must list exactly cases/.
description: pasted-label-ai-text A3b adversarial (fake transport, synthetic texts)
sharing: false
prompts:
  # The instruction is the shipped prompt-v1 inside the Swift request builder (pinned by SHA-256).
  - id: prompt-v1
    label: prompt-v1
    raw: '{{label_id}}'
providers:
  - id: file://../provider.js
    label: gemini-4-argon-vertex-us
    config:
      route: gemini-4-argon-vertex-us
      cell: v1__gemini-4-argon-vertex-us__adversarial-fake
      promptVersion: prompt-v1
defaultTest:
  assert:
    - type: javascript
      value: file://../assert.js
tests:
  - vars: { label_id: adv-fabricated-tw-01 }
  - vars: { label_id: adv-fabricated-uk-01 }
  - vars: { label_id: adv-inject-tw-01 }
  - vars: { label_id: adv-inject-uk-01 }
  - vars: { label_id: adv-nonlabel-tw-01 }
  - vars: { label_id: adv-nonlabel-uk-01 }
  - vars: { label_id: adv-reassign-tw-01 }
  - vars: { label_id: adv-reassign-uk-01 }
  - vars: { label_id: adv-truncated-tw-01 }
  - vars: { label_id: adv-truncated-uk-01 }
  - vars: { label_id: adv-twopanel-tw-01 }
  - vars: { label_id: adv-twopanel-uk-01 }
  - vars: { label_id: adv-twopanel-uk-02 }
