name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Runs unconditionally, before any skip decision is accepted. A failure here
      # fails this job, which leaves the output unset and so runs every job.
      - name: Validate change classifier
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_ci_changes.py' -v

      - name: Decide whether code jobs are needed
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Decide with the base revision's reviewed classifier so a change cannot
          # loosen its own gate. Fall back to this revision only when the base has
          # no classifier yet; the head classifier treats .github/ as code anyway.
          classifier=".github/scripts/ci_changes.py"
          if git cat-file -e "$BASE_SHA:$classifier" 2>/dev/null; then
            git show "$BASE_SHA:$classifier" > "$RUNNER_TEMP/ci_changes_base.py"
            classifier="$RUNNER_TEMP/ci_changes_base.py"
          fi
          python3 "$classifier" \
            --event-name "$EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  nutrition-evaluation-contracts:
    name: Nutrition evaluation harness contracts
    runs-on: ubuntu-latest
    needs: changes
    # Fail closed: only an explicit documentation-only decision skips this job.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify public synthetic scoring and readiness contracts
        run: |
          python3 -m unittest discover -s Tools/NutritionEvaluationSpike/tests -v
          python3 -m unittest discover -s Tools/NutritionAcceptanceReadiness/tests -v
          python3 -m unittest discover -s Tools/FoodSourceEvaluation/tests -v
          python3 -m unittest discover -s Tools/GenericFoodProposalEvaluation -p 'test_*.py' -v

  food-healthkit-planning:
    name: HealthKit planning reference contracts
    runs-on: ubuntu-latest
    needs: changes
    # Fail closed: only an explicit documentation-only decision skips this job.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify synthetic planning examples without HealthKit
        run: python3 -m unittest discover -s Tools/FoodHealthKitPlanning/tests -v

  food-ledger-kit-build:
    name: FoodLedgerKit build and contracts
    runs-on: macos-26
    needs: changes
    # Fail closed: only an explicit documentation-only decision skips this job.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # 15, not 10: main already takes 8m08s-8m31s and the retrieval replay now
    # also covers the production three-source composite (see "FoodLedgerKit job timeout" in the CI analysis doc).
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test FoodLedgerKit and replay ranked retrieval
        env:
          WHR_RETRIEVAL_REPORT: ${{ runner.temp }}/retrieval-current.json
          WHR_RETRIEVAL_REPORT_V4: ${{ runner.temp }}/retrieval-v4-current.json
          WHR_RETRIEVAL_REPORT_V5: ${{ runner.temp }}/retrieval-v5-current.json
          WHR_RETRIEVAL_REPORT_V6: ${{ runner.temp }}/retrieval-v6-current.json
        run: |
          set -euo pipefail
          swift test --package-path Packages/FoodLedgerKit
          python3 -m unittest discover -s Tools/FoodSearchQuality/tests -v
          # food-lexical-terms-v9: frozen v3 to v5 labels scored on the current replay,
          # plus the v6 plural cases (docs/food-lexical-terms-v9.md).
          python3 Tools/FoodSearchQuality/score_retrieval.py \
            Tools/FoodSearchQuality/retrieval-scenarios-v3.json \
            "$WHR_RETRIEVAL_REPORT" "$RUNNER_TEMP/retrieval-metrics.json" \
            --verify-report Tools/FoodSearchQuality/retrieval-metrics-final-lexical-v9.json
          python3 Tools/FoodSearchQuality/score_retrieval.py \
            Tools/FoodSearchQuality/retrieval-scenarios-v4.json \
            "$WHR_RETRIEVAL_REPORT_V4" "$RUNNER_TEMP/retrieval-v4-metrics.json" \
            --verify-report Tools/FoodSearchQuality/retrieval-metrics-v4-final-lexical-v9.json
          python3 Tools/FoodSearchQuality/score_retrieval.py \
            Tools/FoodSearchQuality/retrieval-scenarios-v5.json \
            "$WHR_RETRIEVAL_REPORT_V5" "$RUNNER_TEMP/retrieval-v5-metrics.json" \
            --verify-report Tools/FoodSearchQuality/retrieval-metrics-v5-final-lexical-v9.json
          python3 Tools/FoodSearchQuality/score_retrieval.py \
            Tools/FoodSearchQuality/retrieval-scenarios-v6.json \
            "$WHR_RETRIEVAL_REPORT_V6" "$RUNNER_TEMP/retrieval-v6-metrics.json" \
            --verify-report Tools/FoodSearchQuality/retrieval-metrics-v6-final-lexical-v9.json

  food-ledger-kit-isolation:
    name: FoodLedgerKit boundaries
    runs-on: macos-26
    needs: changes
    # Fail closed: only an explicit documentation-only decision skips this job.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard target imports and dependency inventory
        run: bash Packages/FoodLedgerKit/Scripts/check-boundaries.sh

      - name: Guard app presentation imports
        run: bash Tools/check-app-boundaries.sh

  food-match-evaluation:
    name: Generic-food matching evaluation
    runs-on: macos-26
    needs: changes
    # Fail closed: only an explicit documentation-only decision skips this job.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify frozen fixtures, matcher and report
        run: |
          python3 -m unittest discover -s Tools/FoodMatchEvaluation/tests -v
          python3 -m unittest discover -s Tools/FoodModelChallenger/tests -v
          python3 Tools/FoodMatchEvaluation/evaluate.py \
            --contract Tools/FoodMatchEvaluation/frozen-contract-v1.json \
            --corpus Tools/FoodMatchEvaluation/fixtures/cofid-2021-evaluation-v1.json.gz \
            --gold Tools/FoodMatchEvaluation/fixtures/gold-set-v1.json \
            --verify-report Tools/FoodMatchEvaluation/result-v1.json

  gemini-grounding-evaluation:
    name: Gemini grounding offline evaluation contracts
    runs-on: ubuntu-latest
    needs: changes
    # Fail closed: only an explicit documentation-only decision skips this job.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify frozen cases and replay scorer
        run: |
          set -euo pipefail
          python3 Tools/GeminiGroundingEvaluation/evaluate.py \
            --contract Tools/GeminiGroundingEvaluation/frozen-contract-v1.json \
            --validate-cases Tools/GeminiGroundingEvaluation/cases-v1.json
          python3 Tools/GeminiGroundingEvaluation/evaluate.py \
            --contract Tools/GeminiGroundingEvaluation/frozen-contract-v2.json \
            --validate-cases Tools/GeminiGroundingEvaluation/cases-v2.json
          python3 -m unittest discover -s Tools/GeminiGroundingEvaluation/tests -v

  food-ocr-evaluation:
    name: Food OCR evaluation contracts
    runs-on: ubuntu-latest
    needs: changes
    # Fail closed: only an explicit documentation-only decision skips this job.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify printed-label evaluation contracts and fixtures
        run: |
          python3 -m unittest discover -s Tools/FoodOCREvaluation/tests -v
          python3 Tools/FoodOCREvaluation/validate_contract_v2.py \
            Tools/FoodOCREvaluation/frozen-contract-v2.json

  label-capture-evaluation:
    name: Nutrition-label capture evaluation contracts
    runs-on: ubuntu-latest
    needs: changes
    # Fail closed: only an explicit documentation-only decision skips this job.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python 3.11 (Unicode 14.0.0): the Swift parity check compares the frozen gate v2 marker
      # classes against Python `re` and fails under any other Unicode database (#93).
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Offline: scorers, arithmetic checks, sealed-set guard and contract hashes.
      # No model, provider or Vision call; the Inspect wiring test is skipped here.
      - name: Verify label-capture contract and pure unit tests
        run: |
          python3 -m unittest discover -s Tools/NutritionLabelCaptureEvaluation/tests -v
          python3 Tools/NutritionLabelCaptureEvaluation/validate_contract.py \
            Tools/NutritionLabelCaptureEvaluation/frozen-contract-v1.json

      # Installs the hash-locked Inspect AI, pyright and ruff from PyPI into the harness
      # venv (network, but no model or provider call), then runs ruff, pyright and the
      # same tests, including the Inspect wiring test with a stub parser and mockllm.
      - name: Verify Inspect wiring, ruff and pyright with hash-locked tools
        working-directory: Tools/NutritionLabelCaptureEvaluation
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/pyright
          .venv/bin/python -m unittest discover -s tests -v

  drive-export-kit-build:
    name: DriveExportKit build
    runs-on: macos-26
    needs: changes
    # Fail closed: only an explicit documentation-only decision skips this job.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test HealthKit-free DriveExportKit
        run: swift test --package-path Packages/DriveExportKit

  drive-export-kit-isolation:
    name: DriveExportKit isolation
    runs-on: macos-26
    needs: changes
    # Fail closed: only an explicit documentation-only decision skips this job.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard package isolation
        run: |
          if grep -rnE "import HealthKit|import UIKit|HealthKitUI|DailyHealthExportEnvelope|NutritionCatalogue|DailyNotesPolicy|HealthKitClient" \
            Packages/DriveExportKit/Sources; then
            echo "DriveExportKit must not depend on HealthKit or app model types" >&2
            exit 1
          fi

  synthetic-drive-policy-checks:
    name: Synthetic Drive policy checks
    runs-on: macos-26
    needs: changes
    # Fail closed: only an explicit documentation-only decision skips this job.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run synthetic consent and policy checks
        run: |
          xcrun swiftc -module-cache-path "$RUNNER_TEMP/whr-consent-swift-module-cache" \
            Packages/DriveExportKit/Sources/DriveExportKit/*.swift \
            Tools/SyntheticDriveExport/ExportPolicy.swift \
            Tools/SyntheticDriveExport/HarnessCompatibility.swift \
            Tools/SyntheticDriveExport/PolicyChecks.swift \
            -o "$RUNNER_TEMP/whr-consent-policy-checks"
          "$RUNNER_TEMP/whr-consent-policy-checks"

  synthetic-drive-api-checks:
    name: Synthetic Drive API checks
    runs-on: macos-26
    needs: changes
    # Fail closed: only an explicit documentation-only decision skips this job.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run synthetic Drive API checks
        run: |
          xcrun swiftc -module-cache-path "$RUNNER_TEMP/whr-consent-swift-module-cache" \
            Packages/DriveExportKit/Sources/DriveExportKit/*.swift \
            Tools/SyntheticDriveExport/ExportPolicy.swift \
            Tools/SyntheticDriveExport/HarnessCompatibility.swift \
            Tools/SyntheticDriveExport/CanonicalTransport.swift \
            Tools/SyntheticDriveExport/DriveAPIChecks.swift \
            -o "$RUNNER_TEMP/whr-drive-api-checks"
          "$RUNNER_TEMP/whr-drive-api-checks"

  synthetic-drive-coordinator-checks:
    name: Synthetic Drive coordinator checks
    runs-on: macos-26
    needs: changes
    # Fail closed: only an explicit documentation-only decision skips this job.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shipping coordinator against synthetic fixtures
        run: |
          xcrun swiftc -module-cache-path "$RUNNER_TEMP/whr-consent-swift-module-cache" \
            Packages/DriveExportKit/Sources/DriveExportKit/*.swift \
            Tools/SyntheticDriveExport/ExportPolicy.swift \
            Tools/SyntheticDriveExport/HarnessCompatibility.swift \
            Tools/SyntheticDriveExport/CanonicalTransport.swift \
            Tools/SyntheticDriveExport/SyntheticFixtureIdentityPolicy.swift \
            Tools/SyntheticDriveExport/CanonicalTransportChecks.swift \
            -o "$RUNNER_TEMP/whr-canonical-transport-checks"
          "$RUNNER_TEMP/whr-canonical-transport-checks"

  synthetic-drive-harness:
    name: Synthetic Drive harness build and analysis
    runs-on: macos-26
    needs: changes
    # Fail closed: only an explicit documentation-only decision skips this job.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and analyze synthetic harness
        run: |
          xcodebuild \
            -project Tools/SyntheticDriveExport/SyntheticDriveExport.xcodeproj \
            -scheme SyntheticDriveExport \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/whr-drive-consent-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build analyze

  test:
    name: Build and test
    # Medication dose events require the iOS 26 SDK and Xcode 26 or later.
    runs-on: macos-26
    needs: changes
    # Fail closed: only an explicit documentation-only decision skips this job.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # The suite took 17 minutes on 25 October 2026 (PR #324) and grows with the photo route.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Evaluate shadow CI policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/ci_policy.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-json "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/ci-policy.json" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          /usr/bin/time -p xcodebuild -resolvePackageDependencies \
            -project WeeklyHealthReport.xcodeproj \
            -scheme WeeklyHealthReport

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$({ xcrun simctl list devices available -j; } | python3 -c '
          import json
          import sys

          devices = json.load(sys.stdin)["devices"]
          iphones = [
              device
              for runtime in devices.values()
              for device in runtime
              if device["name"].startswith("iPhone")
          ]
          if not iphones:
              raise SystemExit("No available iPhone simulator found")
          print(iphones[0]["udid"])
          ' )"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Validate CI helpers
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Verify food query development regressions
        run: |
          set -euo pipefail
          python3 Tools/FoodQueryEvaluation/validate.py v8
          python3 -m unittest discover -s Tools/FoodQueryEvaluation/tests
          swiftc Packages/FoodLedgerKit/Sources/FoodLedgerApplication/FoodQueryParser.swift Packages/FoodLedgerKit/Sources/FoodLedgerApplication/FoodQueryDiscoveryPolicy.swift Tools/FoodQueryEvaluation/run.swift -o "$RUNNER_TEMP/food-query-eval"
          "$RUNNER_TEMP/food-query-eval" Tools/FoodQueryEvaluation/synthetic-v8.json "$RUNNER_TEMP/food-query-results.json"
          python3 Tools/FoodQueryEvaluation/score.py Tools/FoodQueryEvaluation/synthetic-v8.json "$RUNNER_TEMP/food-query-results.json" "$RUNNER_TEMP/food-query-report.json" --gate

      - name: Run Xcode static analysis
        run: |
          set -euo pipefail
          /usr/bin/time -p xcodebuild analyze \
            -project WeeklyHealthReport.xcodeproj \
            -scheme WeeklyHealthReport \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests with code coverage
        run: |
          set -euo pipefail
          /usr/bin/time -p xcodebuild test \
            -project WeeklyHealthReport.xcodeproj \
            -scheme WeeklyHealthReport \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -enableCodeCoverage YES \
            -resultBundlePath "$RUNNER_TEMP/WeeklyHealthReportTests.xcresult" \
            -parallel-testing-enabled NO \
            ENABLE_DEBUG_DYLIB=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Summarise code coverage
        run: |
          python3 .github/scripts/summarize_coverage.py \
            --xcresult "$RUNNER_TEMP/WeeklyHealthReportTests.xcresult" \
            --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/coverage-summary.md" \
            --github-step-summary "$GITHUB_STEP_SUMMARY" \
            --minimum-domain-coverage 95

      - name: Upload app coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          disable_telem: true
          fail_ci_if_error: true
          files: WeeklyHealthReport.app.coverage.txt
          plugins: xcode
          swift_project: WeeklyHealthReport
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.3.1

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-and-coverage-results
          path: |
            ${{ runner.temp }}/WeeklyHealthReportTests.xcresult
            ${{ runner.temp }}/coverage-summary.md
          if-no-files-found: warn
          retention-days: 14

      - name: Collect workflow step timings
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5; do
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
              > "$RUNNER_TEMP/actions-jobs.json"
            if jq -e '
              .jobs[]
              | select(.name == "Build and test")
              | .steps[]
              | select(.name == "Upload test and coverage results")
              | .conclusion == "success"
            ' "$RUNNER_TEMP/actions-jobs.json" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "completed artifact-upload timing was unavailable" >&2
          exit 1

      - name: Summarise CI timing
        if: success()
        run: |
          python3 .github/scripts/summarize_ci_timing.py \
            --jobs-json "$RUNNER_TEMP/actions-jobs.json" \
            --xcresult "$RUNNER_TEMP/WeeklyHealthReportTests.xcresult" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/ci-timing.json" \
            --markdown-output "$RUNNER_TEMP/ci-timing-summary.md" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload CI measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-ci-measurement
          path: |
            ${{ runner.temp }}/ci-policy.json
            ${{ runner.temp }}/ci-timing.json
            ${{ runner.temp }}/ci-timing-summary.md
          if-no-files-found: warn
          retention-days: 14
