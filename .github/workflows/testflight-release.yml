# Internal TestFlight release (issue #85). Design: docs/testflight-ci-release-v1.md
#
# Manual dispatch on main only. Inert until the owner creates the protected
# `testflight` environment and its secrets; until then the release job cannot
# receive credentials. Internal testing only: no external groups, public links or
# App Review. Never interpolate secrets or inputs into a run: body; pass them
# through env: and quote them.

name: Internal TestFlight release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Fresh build number (CFBundleVersion), never reused. No automatic renumbering."
        required: true
        type: string
      release_doc:
        description: "Release record under docs/releases/ whose '## What to Test' text block is used. Leave empty to use what_to_test."
        required: false
        type: string
        default: ""
      what_to_test:
        description: "What to Test text, when release_doc is empty."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Archive, export and verify only. Untick to upload; an upload consumes the build number."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time across the repository. Never cancel a run that may have uploaded.
concurrency:
  group: testflight-release
  cancel-in-progress: false

env:
  # Reviewed, non-secret release identity.
  ASC_APP_ID: "6812893951"
  ASC_INTERNAL_GROUP_ID: "a626bae5-2ff3-4221-917d-435a826662b8"
  TEAM_ID: "MDNYU95CGT"
  BUNDLE_ID: "com.otherweather.ReportWeeklyHealth"

defaults:
  run:
    # No -x anywhere. Each script also starts with `set +x` in case a profile sets it.
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  guard:
    name: Source guard (no credentials)
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.repository == 'syamaner/WeeklyHealthReport'
      && github.ref == 'refs/heads/main'
      && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      build_number: ${{ steps.source.outputs.build_number }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test the release helpers
        run: |
          set +x
          python3 -m unittest discover -s .github/scripts/tests -p 'test_testflight_release.py' -v

      - name: Check dispatch, inputs, project version and main CI
        id: source
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_DOC: ${{ inputs.release_doc }}
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +x
          python3 .github/scripts/testflight_guard.py source --root .

  release:
    name: Archive, verify and upload to internal TestFlight
    needs: guard
    # Re-running only this job would reuse the guard's outputs, so the attempt is checked here too.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.repository == 'syamaner/WeeklyHealthReport'
      && github.ref == 'refs/heads/main'
      && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 90
    environment: testflight
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.guard.outputs.sha }}
      RELEASE_VERSION: ${{ needs.guard.outputs.version }}
      BUILD_NUMBER: ${{ needs.guard.outputs.build_number }}
    steps:
      - name: Check out the guarded commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false

      - name: Confirm the checkout and toolchain
        run: |
          set +x
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]] || { echo "::error::re-runs are refused"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo "::error::checkout does not match the guarded SHA"; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo "::error::checkout is not clean"; exit 1; }
          xcodebuild -version

      - name: Resolve What to Test
        env:
          RELEASE_DOC: ${{ inputs.release_doc }}
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
        run: |
          set +x
          mkdir -p "$RUNNER_TEMP/release"
          python3 .github/scripts/testflight_guard.py what-to-test --root . --output "$RUNNER_TEMP/release/what-to-test.txt"

      - name: Write the App Store Connect key to a private temporary file
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set +x
          umask 077
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{8,12}$ ]] || { echo "::error::ASC_KEY_ID is missing or malformed"; exit 1; }
          key_dir="$RUNNER_TEMP/asc/private_keys"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path"
          head -n 1 "$key_path" | grep -qx -- '-----BEGIN PRIVATE KEY-----' \
            || { echo "::error::ASC_PRIVATE_KEY is not a PKCS#8 private key"; exit 1; }
          {
            echo "ASC_KEY_PATH=$key_path"
            echo "API_PRIVATE_KEYS_DIR=$key_dir"
          } >> "$GITHUB_ENV"

      - name: Preflight App Store Connect (internal group, unused build number)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +x
          python3 .github/scripts/testflight_asc.py preflight \
            --app-id "$ASC_APP_ID" \
            --group-id "$ASC_INTERNAL_GROUP_ID" \
            --build-number "$BUILD_NUMBER" \
            --version "$RELEASE_VERSION" \
            --output "$RUNNER_TEMP/release/preflight.json"

      - name: Import the distribution identity into a temporary keychain
        env:
          DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          DIST_PROFILE_B64: ${{ secrets.DIST_PROFILE_B64 }}
        run: |
          set +x
          umask 077
          signing="$RUNNER_TEMP/signing"
          mkdir -p "$signing"
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 5400 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DIST_P12_B64" | base64 --decode > "$signing/distribution.p12"
          security import "$signing/distribution.p12" -k "$keychain" -f pkcs12 \
            -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          rm -f "$signing/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identities="$(security find-identity -v -p codesigning "$keychain" | grep -c 'Apple Distribution' || true)"
          [[ "$identities" == "1" ]] || { echo "::error::expected exactly one Apple Distribution identity, found $identities"; exit 1; }

          printf '%s' "$DIST_PROFILE_B64" | base64 --decode > "$signing/profile.mobileprovision"
          security cms -D -i "$signing/profile.mobileprovision" > "$signing/profile.plist"
          profile_uuid="$(plutil -extract UUID raw -o - "$signing/profile.plist")"
          profile_name="$(plutil -extract Name raw -o - "$signing/profile.plist")"
          [[ "$profile_uuid" =~ ^[0-9A-Fa-f-]{36}$ ]] || { echo "::error::profile UUID is malformed"; exit 1; }
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$signing/profile.mobileprovision" "$dir/$profile_uuid.mobileprovision"
          done
          {
            echo "RELEASE_KEYCHAIN=$keychain"
            echo "PROFILE_UUID=$profile_uuid"
            echo "PROFILE_NAME=$profile_name"
          } >> "$GITHUB_ENV"

      - name: Write git-ignored build configuration
        env:
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_REDIRECT_SCHEME: ${{ secrets.DRIVE_OAUTH_REDIRECT_SCHEME }}
        run: |
          set +x
          umask 077
          [[ "$DRIVE_OAUTH_CLIENT_ID" =~ ^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$ ]] \
            || { echo "::error::DRIVE_OAUTH_CLIENT_ID is missing or malformed"; exit 1; }
          [[ "$DRIVE_OAUTH_REDIRECT_SCHEME" == "com.googleusercontent.apps.${DRIVE_OAUTH_CLIENT_ID%.apps.googleusercontent.com}" ]] \
            || { echo "::error::DRIVE_OAUTH_REDIRECT_SCHEME is not the reverse client id"; exit 1; }
          printf 'GOOGLE_OAUTH_CLIENT_ID = %s\nGOOGLE_OAUTH_REDIRECT_SCHEME = %s\n' \
            "$DRIVE_OAUTH_CLIENT_ID" "$DRIVE_OAUTH_REDIRECT_SCHEME" > Config/DriveOAuth.local.xcconfig
          # Only the app target's base configuration includes this file, so the profile
          # specifier never reaches Swift package targets.
          printf 'DEVELOPMENT_TEAM = %s\nPROVISIONING_PROFILE_SPECIFIER = %s\n' \
            "$TEAM_ID" "$PROFILE_NAME" > Config/Signing.local.xcconfig

      - name: Archive (manual distribution signing, no provisioning updates)
        run: |
          set +x
          xcodebuild archive \
            -project WeeklyHealthReport.xcodeproj \
            -scheme WeeklyHealthReport \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/build/WeeklyHealthReport.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/build/DerivedData" \
            -quiet \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RELEASE_KEYCHAIN"

      - name: Export the IPA locally
        run: |
          set +x
          options="$RUNNER_TEMP/build/ExportOptions.plist"
          python3 - "$options" <<'PY'
          import os, plistlib, sys
          plistlib.dump({
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "teamID": os.environ["TEAM_ID"],
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"]},
              "testFlightInternalTestingOnly": True,
              "manageAppVersionAndBuildNumber": False,
              "uploadSymbols": True,
              "stripSwiftSymbols": True,
          }, open(sys.argv[1], "wb"))
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/build/WeeklyHealthReport.xcarchive" \
            -exportPath "$RUNNER_TEMP/build/export" \
            -exportOptionsPlist "$options" \
            -quiet
          shopt -s nullglob
          ipas=("$RUNNER_TEMP/build/export/"*.ipa)
          [[ "${#ipas[@]}" == "1" ]] || { echo "::error::expected exactly one IPA"; exit 1; }
          echo "IPA_PATH=${ipas[0]}" >> "$GITHUB_ENV"

      - name: Verify the IPA before upload
        env:
          EXPECTED_BUNDLE_ID: ${{ env.BUNDLE_ID }}
          EXPECTED_TEAM_ID: ${{ env.TEAM_ID }}
          EXPECTED_VERSION: ${{ needs.guard.outputs.version }}
          EXPECTED_BUILD_NUMBER: ${{ needs.guard.outputs.build_number }}
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_REDIRECT_SCHEME: ${{ secrets.DRIVE_OAUTH_REDIRECT_SCHEME }}
        run: |
          set +x
          python3 .github/scripts/testflight_verify_ipa.py \
            --ipa "$IPA_PATH" \
            --output "$RUNNER_TEMP/release/verify.json"

      - name: Upload once with altool
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +x
          # altool finds AuthKey_<id>.p8 through API_PRIVATE_KEYS_DIR; the key never appears in arguments.
          status=0
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json > "$RUNNER_TEMP/release/upload.json" || status=$?
          python3 - "$RUNNER_TEMP/release/upload.json" "$status" <<'PY'
          import json, sys
          path, status = sys.argv[1], int(sys.argv[2])
          try:
              data = json.load(open(path))
          except (OSError, ValueError):
              data = {}
          def find(node, key):
              if isinstance(node, dict):
                  if key in node:
                      return node[key]
                  for value in node.values():
                      found = find(value, key)
                      if found:
                          return found
              if isinstance(node, list):
                  for value in node:
                      found = find(value, key)
                      if found:
                          return found
              return None
          uuid = find(data, "delivery-uuid") or find(data, "Delivery UUID")
          if status != 0 or not uuid:
              errors = find(data, "product-errors") or "no structured error detail"
              print(f"::error::upload outcome is not confirmed (exit {status}): {errors}")
              print("::error::check App Store Connect read-only before any further build; do not re-run")
              sys.exit(1)
          with open(sys.argv[1] + ".uuid", "w") as handle:
              handle.write(str(uuid))
          print(f"uploaded; delivery UUID {uuid}")
          PY

      - name: Wait for processing, set What to Test and assign the internal group
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +x
          python3 .github/scripts/testflight_asc.py distribute \
            --app-id "$ASC_APP_ID" \
            --group-id "$ASC_INTERNAL_GROUP_ID" \
            --build-number "$BUILD_NUMBER" \
            --version "$RELEASE_VERSION" \
            --what-to-test-file "$RUNNER_TEMP/release/what-to-test.txt" \
            --output "$RUNNER_TEMP/release/distribute.json"

      - name: Write the job summary (no secrets)
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set +x
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          temp = pathlib.Path(os.environ["RUNNER_TEMP"], "release")
          def load(name):
              try:
                  return json.loads((temp / name).read_text())
              except (OSError, ValueError):
                  return {}
          verify, distribute = load("verify.json"), load("distribute.json")
          uuid_file = temp / "upload.json.uuid"
          uuid = uuid_file.read_text().strip() if uuid_file.exists() else "not uploaded or not confirmed"
          xcode = subprocess.run(["xcodebuild", "-version"], capture_output=True, text=True).stdout.replace("\n", " ").strip()
          rows = [
              ("Mode", "dry run (no upload)" if os.environ.get("DRY_RUN") == "true" else "upload"),
              ("Source SHA", os.environ.get("RELEASE_SHA", "")),
              ("Version (build)", f"{os.environ.get('RELEASE_VERSION', '')} ({os.environ.get('BUILD_NUMBER', '')})"),
              ("Bundle", os.environ.get("BUNDLE_ID", "")),
              ("Toolchain", xcode),
              ("Profile", f"{verify.get('profile_name', '?')} {verify.get('profile_uuid', '')}, expires {verify.get('profile_expiry', '?')}"),
              ("IPA SHA-256", verify.get("ipa_sha256", "not exported")),
              ("IPA checks", "passed" if verify and not verify.get("failures") else "failed or not run"),
              ("Delivery UUID", uuid),
              ("Apple build id", distribute.get("build_id", "not confirmed")),
              ("Internal group assigned", str(distribute.get("internal_group_assigned", False))),
          ]
          lines = ["## Internal TestFlight release", "", "| Item | Value |", "| --- | --- |"]
          lines += [f"| {key} | `{value}` |" for key, value in rows]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Remove credentials, keychain and build products
        if: always()
        run: |
          set +x
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
          security list-keychains -d user -s login.keychain-db || true
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
                  "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/signing" "$RUNNER_TEMP/build" "$RUNNER_TEMP/release"
          rm -f Config/DriveOAuth.local.xcconfig Config/Signing.local.xcconfig
